name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompresser le projet
        run: unzip -o -q ./*.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer le SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler l'APK
        working-directory: TableauBordIA
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TableauBordIA-apk
          path: TableauBordIA/app/build/outputs/apk/debug/*.apk
